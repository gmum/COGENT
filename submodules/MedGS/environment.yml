name: medgs

# Channel priority (highest → lowest). conda resolves packages in this order.
# pytorch  → PyTorch wheels built against the selected CUDA version
# nvidia   → CUDA compiler + dev headers (version set by setup.sh --cuda X.Y)
# conda-forge → science stack, hermetic compilers (installed post-create via setup.sh)
# defaults → fallback
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # ── Python ────────────────────────────────────────────────────────────────
  - python=3.10

  # ── PyTorch (CUDA 12.4 build) ─────────────────────────────────────────────
  # pytorch-cuda=12.4 is a "feature" package from the nvidia channel that
  # constrains conda to select the cuda12.4 builds of pytorch/torchvision/torchaudio.
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=CUDA_VER
  # cuda-version is the authoritative pin the nvidia solver uses to constrain
  # all CUDA sub-packages. Without it the solver freely pulls newer versions
  # (e.g. cuda-cccl 13.2) even when cuda-toolkit is pinned to 12.4.
  - cuda-version=CUDA_VER
  - cuda-toolkit=CUDA_VER.*  # full CUDA dev umbrella (meta-package)
  - cuda-nvcc=CUDA_VER.*     # pin compiler explicitly
  - cuda-cccl=CUDA_VER.*     # cub/cub.cuh, cuda/std/*, nv/target — needed by diff-gaussian-rasterization
                              # CUDA_VER substituted by setup.sh --cuda X.Y (default: 12.4)
                              # Valid values: 11.8, 12.1, 12.4  (pytorch conda channel limit)

  # ── Build tools
  # NOTE: gcc_linux-64 / gxx_linux-64 are installed by setup.sh AFTER env
  # creation to avoid a conda activation-script bug that fires during the
  # internal pip subprocess of `conda env create`. ───────────────────────────────────────────────────────────
  - ninja           # parallel kernel compilation (significantly faster builds)
  - cmake>=3.20     # required by several CUDA extension build systems
  - packaging       # needed by torch.utils.cpp_extension at build time

  # ── Science / ML stack (available on conda-forge for reliable ABI) ────────
  - tqdm
  - scipy
  - matplotlib
  - scikit-image

  # ── pip (always pin the pip executable itself inside the conda env) ────────
  - pip

  # ── PyPI-only packages ────────────────────────────────────────────────────
  - pip:
    - plyfile           # .ply file I/O for point clouds and meshes
    - wandb             # experiment tracking
    - opencv-python     # image I/O and processing (requirements.txt)
    - trimesh           # mesh utilities (requirements.txt)
    - nibabel           # medical image I/O — NIfTI/DICOM (requirements.txt)
    - open3d            # 3-D point cloud / mesh visualisation (requirements.txt)
